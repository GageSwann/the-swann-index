# Install once per clone: pre-commit install
# Run on everything:      pre-commit run --all-files
#
# Vendored third-party skills (.claude/skills/<name>/) stay byte-identical to the
# reviewed upstream commit (see .claude/skills/SOURCES.md), so the formatting and
# linting hooks skip them. Secret and private-key scanning still cover them.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^\.claude/skills/(?!SOURCES\.md)
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^\.claude/skills/(?!SOURCES\.md)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^\.claude/skills/
      - id: ruff-format
        exclude: ^\.claude/skills/
