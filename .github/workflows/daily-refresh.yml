# Nightly: refresh the in-progress season from CFBD, refit ratings + rankings,
# grade finished picks, and publish prediction snapshots + picks (`tsi run`).
# Then refreshes the deployed site's cached pages.
# Secrets: CFBD_API_KEY, DATABASE_URL (Neon `production` branch), REVALIDATE_TOKEN.
# Variables: TSI_API_URL (Render), SITE_URL (Vercel). Repo Settings -> Secrets and variables -> Actions.
#
# When it runs (Phase 12.1, decision #126): cron-job.org starts it at 11:00 UTC (6 AM EST /
# 7 AM EDT) through the workflow_dispatch API, because GitHub started scheduled runs 5-10
# hours late. GitHub's own schedule below is only a backup: it skips itself when a run
# already succeeded today (UTC).
name: Daily refresh

on:
  schedule:
    - cron: "23 14 * * *" # backup only; off the busy top of the hour
  workflow_dispatch: # cron-job.org (11:00 UTC) and the "Run workflow" button

permissions:
  contents: read

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  # A scheduled (backup) run goes ahead only if no run succeeded earlier today.
  # Manual and cron-job.org runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          done_today=$(gh run list --repo "$REPO" --workflow daily-refresh.yml \
            --created ">=$today" --status success --limit 20 --json databaseId \
            --jq "[.[] | select(.databaseId != $THIS_RUN)] | length")
          if [ "$done_today" -gt 0 ]; then
            echo "A run already succeeded today ($today UTC); skipping the backup."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run yet today ($today UTC); running the backup."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0 # exact tag: setup-uv has no floating major tag

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # ingest (CFBD) -> rate -> grade finished games -> publish snapshots for the next 8 days.
      # If ingest fails, the rest still runs on stored data and the step exits 1.
      - name: Run the live pipeline
        run: uv run tsi run
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Refresh the site so it shows tonight's ratings and picks (doc 02, decision #80).
      # Runs even if ingest failed (the rest of `tsi run` still published); skipped until
      # the TSI_API_URL and SITE_URL repository variables are set.
      - name: Refresh the site
        if: ${{ !cancelled() && vars.SITE_URL != '' && vars.TSI_API_URL != '' }}
        working-directory: .
        env:
          API_URL: ${{ vars.TSI_API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          # Wake the API first: Render's free tier sleeps when idle.
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$API_URL/health" > /dev/null
          curl -fsS -X POST -H "Authorization: Bearer $REVALIDATE_TOKEN" "$SITE_URL/api/revalidate"
          echo
          # The first visit after a refresh gets the cached page while the new one builds;
          # visit the main pages now so readers get fresh ones (FCS views and Playoff: #117).
          WEEK=$(curl -fsS --max-time 60 "$API_URL/meta/current" | jq -r '"\(.season)/\([.week, 1] | max)"')
          PAGES="/ /week /book /model /playoff /rankings/fcs /week/$WEEK/fcs"
          for page in $PAGES; do
            curl -fsS -L -o /dev/null --max-time 120 "$SITE_URL$page"
          done
          sleep 20
          for page in $PAGES; do
            curl -fsS -L -o /dev/null -w "%{http_code} $page\n" --max-time 120 "$SITE_URL$page"
          done
