# Nightly: refresh the in-progress season from CFBD, refit ratings + rankings,
# grade finished picks, and publish prediction snapshots + picks (`tsi run`).
# Then refreshes the deployed site's cached pages.
# Secrets: CFBD_API_KEY, DATABASE_URL (Neon `production` branch), REVALIDATE_TOKEN.
# Variables: TSI_API_URL (Render), SITE_URL (Vercel). Repo Settings -> Secrets and variables -> Actions.
#
# When it runs (Phase 12.1, decision #126): cron-job.org starts it at 11:00 UTC (6 AM EST /
# 7 AM EDT) through the workflow_dispatch API, because GitHub started scheduled runs 5-10
# hours late. GitHub's own schedule below is only a backup: it skips itself when a run
# already succeeded today (UTC).
name: Daily refresh

on:
  schedule:
    - cron: "23 14 * * *" # backup only; off the busy top of the hour
  workflow_dispatch: # cron-job.org (11:00 UTC) and the "Run workflow" button

permissions:
  contents: read

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  # A scheduled (backup) run goes ahead only if no run succeeded earlier today.
  # Manual and cron-job.org runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          done_today=$(gh run list --repo "$REPO" --workflow daily-refresh.yml \
            --created ">=$today" --status success --limit 20 --json databaseId \
            --jq "[.[] | select(.databaseId != $THIS_RUN)] | length")
          if [ "$done_today" -gt 0 ]; then
            echo "A run already succeeded today ($today UTC); skipping the backup."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run yet today ($today UTC); running the backup."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0 # exact tag: setup-uv has no floating major tag

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # ingest (CFBD) -> rate -> grade finished games -> publish snapshots for the next 8 days.
      # If ingest fails, the rest still runs on stored data and the step exits 1.
      - name: Run the live pipeline
        run: uv run tsi run
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Refresh the site so it shows tonight's ratings and picks (doc 02, decision #80).
      # Runs even if ingest failed (the rest of `tsi run` still published); skipped until
      # the TSI_API_URL and SITE_URL repository variables are set.
      - name: Refresh the site
        if: ${{ !cancelled() && vars.SITE_URL != '' && vars.TSI_API_URL != '' }}
        working-directory: .
        env:
          API_URL: ${{ vars.TSI_API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          # Wake the API first: Render's free tier sleeps when idle.
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$API_URL/health" > /dev/null
          curl -fsS -X POST -H "Authorization: Bearer $REVALIDATE_TOKEN" "$SITE_URL/api/revalidate"
          echo
          # The refresh expires every page (Phase 12.2), so the first visit to each one waits
          # ~1 s while it builds. Visit the main pages and both Top 25s' team pages now, one at
          # a time (Render's free tier refuses bursts), so readers get them ready-made.
          # College football's pages and API paths are under /cfb (#183).
          WEEK=$(curl -fsS --max-time 60 "$API_URL/cfb/meta/current" | jq -r '"\(.season)/\([.week, 1] | max)"')
          PAGES="/cfb /cfb/rankings /cfb/schedule/$WEEK /cfb/playoffs /cfb/playoffs/fcs /cfb/rankings/fcs /cfb/rankings/all /cfb/schedule/$WEEK/fcs /cfb/schedule/$WEEK/all"
          for division in fbs fcs; do
            TEAMS=$(curl -fsS --max-time 60 "$API_URL/cfb/rankings?type=power&division=$division" | jq -r '.teams[:25][].team.slug')
            for slug in $TEAMS; do PAGES="$PAGES /cfb/teams/$slug"; done
          done
          for page in $PAGES; do
            curl -fsS -L -o /dev/null -w "%{http_code} %{time_total}s $page\n" --max-time 120 \
              --retry 2 --retry-delay 5 --retry-all-errors "$SITE_URL$page"
          done

  # Neon's network transfer this period vs. the free 5 GB (#140, #179): one Neon API call,
  # no database reads. Writes the reading to the run's summary; averaging over 80 MB a day
  # adds a warning; on pace to go over (or 80% used) opens one issue per period, then
  # comments on it. Never turns the run red: the backup gate counts successful runs, and a
  # red run would make the 14:23 backup run `tsi run` again.
  # Needs the NEON_API_KEY secret and the NEON_PROJECT_ID variable; skipped without them.
  transfer:
    needs: [gate, refresh]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0 # exact tag: setup-uv has no floating major tag

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Check Neon transfer
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          DATABASE_URL: unused # settings require one; this job never connects
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          reading=$(uv run tsi neon transfer --json)
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::notice::Neon transfer check skipped: add the NEON_API_KEY secret and NEON_PROJECT_ID variable."
            exit 0
          elif [ "$code" -ne 0 ]; then
            echo "::warning::Neon transfer check failed (see this step's log)."
            exit 0
          fi
          status=$(jq -r .status <<< "$reading")
          line=$(jq -r '"Neon transfer \(.status): \(.reason). \(.used_bytes / 1e7 | round / 100) GB used in \(.days_elapsed) of \(.days_in_period) days (period from \(.period_start[:10]), \(.period_source)); pace \(.projected_bytes / 1e7 | round / 100) GB, limit \(.limit_bytes / 1e9) GB."' <<< "$reading")
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = "above target" ]; then
            echo "::warning::$line"
          elif [ "$status" = "alert" ]; then
            echo "::warning::$line"
            title="Neon transfer: on pace to go over (period from $(jq -r '.period_start[:10]' <<< "$reading"))"
            body=$(printf '%s\n\nNightly run: %s\n\nWhat to check: doc 10 section 1 (transfer meter, Vercel ISR writes, Render response volume).' "$line" "$RUN_URL")
            number=$(gh issue list --repo "$REPO" --state open --limit 50 --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body"
            fi
          fi
